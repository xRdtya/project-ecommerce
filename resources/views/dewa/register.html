<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>Daftar</title>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>

    <div class="auth-container">
        <h2>Daftar Akun</h2>

        <form class="auth-form">

            <input type="text" placeholder="Nama Lengkap" required>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>

            <label>Pilih Peran:</label>
            <select required>
                <option value="buyer">Pembeli</option>
                <option value="seller">Penjual</option>
            </select>

            <button type="submit" class="btn btn-primary">Daftar</button>
        </form>

        <div class="auth-switch">
            Sudah punya akun? <a href="login.html">Login</a>
        </div>
    </div>

        <script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('.auth-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = this.querySelector('input[type="text"]').value;
            const email = this.querySelector('input[type="email"]').value;
            const password = this.querySelector('input[type="password"]').value;
            const role = this.querySelector('select').value;
            
            // Validasi
            if (!name || !email || !password) {
                alert('Semua field wajib diisi');
                return;
            }
            
            if (name.length < 3) {
                alert('Nama minimal 3 karakter');
                return;
            }
            
            if (!email.includes('@')) {
                alert('Email tidak valid');
                return;
            }
            
            if (password.length < 6) {
                alert('Password minimal 6 karakter');
                return;
            }
            
            // Cek jika email sudah terdaftar (ini simulasi juga klo ngga perlu hapus jua gpp) =============================
            const existingUsers = JSON.parse(localStorage.getItem('users')) || [];
            if (existingUsers.some(user => user.email === email)) {
                alert('Email sudah terdaftar. Silahkan login.');
                window.location.href = "login.html";
                return;
            }
            
            // Simpan user baru
            const newUser = {
                name: name,
                email: email,
                role: role,
                createdAt: new Date().toISOString()
            };
            
            existingUsers.push(newUser);
            localStorage.setItem('users', JSON.stringify(existingUsers));
            
            // Simpan sebagai user aktif
            localStorage.setItem('userData', JSON.stringify({
                name: name,
                email: email,
                role: role
            }));
            
            // Jika seller, inisialisasi data produk
            if (role === 'seller') {
                localStorage.setItem('sellerProducts', JSON.stringify([]));
            }
            
            // Jika buyer, inisialisasi order history
            if (role === 'buyer') {
                localStorage.setItem('orderHistory', JSON.stringify([]));
            }
            
            alert('✅ Registrasi berhasil! Selamat datang di TokoOnline.');
            window.location.href = role === 'seller' ? "seller_dashboard.html" : "main.blade.php";
        });
    });
    </script>
        
    </body>
</html>
